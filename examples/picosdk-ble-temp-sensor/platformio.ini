; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Port of https://github.com/raspberrypi/pico-examples/tree/master/bluetooth/ble_temp_sensor
; Uses BLE to communicate the temperature between a pair of boards:
;  - *_server: peripheral that transmits its temperature (src/server.c)
;  - *_reader: client that connects to a server and reads its temperature (src/client.c)
; btstack_config.h is in include/, the GATT database src/temp_sensor.gatt is compiled to temp_sensor.h automatically.

[env]
platform = raspberrypi
framework = picosdk
build_flags =
    ; build BTstack with BLE support (pico_btstack_ble + pico_btstack_cyw43)
    -D PIO_USE_BTSTACK_BLE
    ; WiFi chip driver without lwIP (pico_cyw43_arch_none)
    -D CYW43_LWIP=0

[server]
build_src_filter = +<server.c>

[reader]
build_src_filter = +<client.c>

[env:rpipicow_server]
extends = server
board = rpipicow

[env:rpipicow_reader]
extends = reader
board = rpipicow

[env:rpipico2w_server]
extends = server
board = rpipico2w

[env:rpipico2w_reader]
extends = reader
board = rpipico2w

[env:pimoroni_pico_plus_2w_server]
extends = server
board = pimoroni_pico_plus_2w

[env:pimoroni_pico_plus_2w_reader]
extends = reader
board = pimoroni_pico_plus_2w
