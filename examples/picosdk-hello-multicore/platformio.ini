; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Port of https://github.com/raspberrypi/pico-examples/tree/master/multicore/hello_multicore
; Core 0 launches core 1, then both exchange a value through the inter-core FIFO.

[env]
platform = raspberrypi
framework = picosdk
build_flags =
    ; the example prints right at startup: wait up to 5 s for the USB serial monitor to connect
    -D PIO_STDIO_USB_CONNECT_WAIT_TIMEOUT_MS=5000

[env:pico]
board = pico

[env:pico2]
board = rpipico2

[env:pico2-riscv]
board = rpipico2
board_build.mcu = rp2350-riscv
