; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Port of https://github.com/raspberrypi/pico-examples/tree/master/pico_w/wifi/tls_client
; (picow_tls_client_background), downloading https://www.howsmyssl.com/a/check.
; lwipopts.h and mbedtls_config.h are in include/.

[env]
platform = raspberrypi
framework = picosdk
build_flags =
    ; build mbedtls and lwIP's TLS support (pico_mbedtls + pico_lwip_mbedtls)
    -D PIO_USE_MBEDTLS
    ; set your WiFi credentials here
    -D WIFI_SSID=\"your-ssid\"
    -D WIFI_PASSWORD=\"your-password\"

[env:rpipicow]
board = rpipicow

[env:rpipico2w]
board = rpipico2w

[env:pimoroni_pico_plus_2w]
board = pimoroni_pico_plus_2w
